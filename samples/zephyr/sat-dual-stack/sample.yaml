sample:
  description: Hubble Network dual-stack (BLE beacon + satellite) example
  name: hubble-sat-dual-stack
common:
  build_only: true
  platform_allow:
    - nrf21540dk/nrf52840
    - thingy53/nrf5340/cpunet
    - nrf54l15dk/nrf54l15/cpuapp
    - xiao_mg24
  tags:
    - bluetooth
    - satellite
tests:
  app.sat.dual_stack.default:
      extra_configs:
      - CONFIG_SAMPLE_PROVIDE_SAT_BOARD_SUPPORT=n
  app.sat.dual_stack.debug:
    extra_configs:
      - CONFIG_HUBBLE_SAMPLE_DEBUG=y
  app.sat.dual_stack.128key:
    extra_configs:
      - CONFIG_HUBBLE_NETWORK_KEY_128=y
  app.sat.dual_stack.mbedtls:
    extra_configs:
      - CONFIG_HUBBLE_NETWORK_CRYPTO_MBEDTLS=y
  app.sat.dual_stack.no_board:
    extra_configs:
      - CONFIG_SAMPLE_PROVIDE_SAT_BOARD_SUPPORT=y
    platform_allow:
      - native_sim
  app.sat.dual_stack.mbedtls_128key:
    extra_configs:
      - CONFIG_HUBBLE_NETWORK_CRYPTO_MBEDTLS=y
      - CONFIG_HUBBLE_NETWORK_KEY_128=y
  app.sat.dual_stack.ncs:
    extra_configs:
      - CONFIG_SAMPLE_PROVIDE_SAT_BOARD_SUPPORT=n
    modules:
      - nrf
    tags:
      - ncs
    required_snippets:
      - ncs-dual-stack
    platform_exclude:
      - native_sim
    platform_allow:
      - nrf21540dk/nrf52840
    integration_platforms:
      - nrf21540dk/nrf52840
