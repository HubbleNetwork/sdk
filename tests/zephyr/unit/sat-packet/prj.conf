CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# Hubble Satellite Network
CONFIG_HUBBLE_SAT_NETWORK=y

# Pin the counter and the sequence number so packets are reproducible
CONFIG_HUBBLE_COUNTER_SOURCE_UNIX_TIME=y
CONFIG_HUBBLE_EID_ROTATION_PERIOD_SEC=86400
CONFIG_HUBBLE_NETWORK_SEQUENCE_NONCE_CUSTOM=y
CONFIG_HUBBLE_UPTIME_CUSTOM=y

# Key size (match test vectors)
CONFIG_HUBBLE_NETWORK_KEY_256=y

# The tests replay fixed sequence numbers on purpose
CONFIG_HUBBLE_NETWORK_SECURITY_ENFORCE_NONCE_CHECK=n
